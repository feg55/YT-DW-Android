name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild"
        required: true
        default: "v0.1.3"
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Verify tag matches versionName
        run: ./gradlew verifyReleaseVersion -PreleaseTag="$RELEASE_TAG" --no-daemon --console=plain

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release-key.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties

      - name: Verify and build signed artifacts
        run: |
          ./gradlew clean check lintRelease assembleRelease bundleRelease \
            -PreleaseAbiSplits=true --no-daemon --console=plain

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/YT-DW-${RELEASE_TAG}-v8-lite.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/YT-DW-${RELEASE_TAG}-v7-legacy.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/YT-DW-${RELEASE_TAG}-x86-emulator.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/YT-DW-${RELEASE_TAG}-universal.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/YT-DW-${RELEASE_TAG}.aab"
          cp THIRD_PARTY_NOTICES.md dist/
          curl --fail-with-body --location --retry 3 \
            --output dist/youtubedl-android-0.18.1-source.tar.gz \
            https://github.com/yausername/youtubedl-android/archive/refs/tags/0.18.1.tar.gz
          curl --fail-with-body --location --retry 3 \
            --output dist/yt-dlp-2026.07.04-source.tar.gz \
            https://github.com/yt-dlp/yt-dlp/archive/refs/tags/2026.07.04.tar.gz
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for old_asset in \
              "YT-DW-${RELEASE_TAG}-arm64-v8a.apk" \
              "YT-DW-${RELEASE_TAG}-armeabi-v7a.apk" \
              "YT-DW-${RELEASE_TAG}-x86_64.apk"; do
              gh release delete-asset "$RELEASE_TAG" "$old_asset" --yes 2>/dev/null || true
            done
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" \
              --notes-file .github/release-notes.md \
              --title "YT-DW ${RELEASE_TAG}"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --notes-file .github/release-notes.md \
              --title "YT-DW ${RELEASE_TAG}"
          fi
