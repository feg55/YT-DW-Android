name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew
      - name: Verify
        run: ./gradlew check assembleDebug --no-daemon --console=plain
